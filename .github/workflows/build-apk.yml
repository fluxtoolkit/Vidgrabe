name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Complete Gradle Project Structure
      run: |
        mkdir -p gradle/wrapper
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        # 1. Gradle Wrapper Properties
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # 2. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "VidGrab"
        include(":app")
        EOF

        # 3. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.secrets) apply false
        }
        EOF

        # 4. gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.nonTransitiveRClass=true
        EOF

        # 5. .env files
        touch .env .env.example

        # 6. themes.xml
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.MyApplication" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

        # 7. xml rules
        cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <data-extraction-rules>
            <cloud-backup><include domain="root" path="."/></cloud-backup>
            <device-transfer><include domain="root" path="."/></device-transfer>
        </data-extraction-rules>
        EOF

        cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
        <?xml version="1.0" encoding="utf-8"?>
        <full-backup-content><include domain="root" path="."/></full-backup-content>
        EOF

        # 8. Fix compileSdk syntax in app/build.gradle.kts if needed
        sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts
        sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
        sed -i 's/alias(libs.plugins.roborazzi)/\\/\\/ alias(libs.plugins.roborazzi)/g' app/build.gradle.kts
        sed -i 's/alias(libs.plugins.google.services)/\\/\\/ alias(libs.plugins.google.services)/g' app/build.gradle.kts
        sed -i 's/implementation(libs.firebase.ai)/\\/\\/ implementation(libs.firebase.ai)/g' app/build.gradle.kts
        sed -i 's/implementation(platform(libs.firebase.bom))/\\/\\/ implementation(platform(libs.firebase.bom))/g' app/build.gradle.kts

        # 9. Create debug.keystore if needed
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VidGrab-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
