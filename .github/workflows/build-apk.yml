name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Complete Gradle Project Structure
      run: |
        mkdir -p gradle/wrapper

        # 1. Gradle Wrapper Properties
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # 2. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google {
                    content {
                        includeGroupByRegex("com\\.android.*")
                        includeGroupByRegex("com\\.google.*")
                        includeGroupByRegex("androidx.*")
                    }
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.name = "VidGrab"
        include(":app")
        EOF

        # 3. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.roborazzi) apply false
            alias(libs.plugins.secrets) apply false
            alias(libs.plugins.google.services) apply false
        }
        EOF

        # 4. gradle/libs.versions.toml
        cat << 'EOF' > gradle/libs.versions.toml
        [versions]
        agp = "8.6.1"
        kotlin = "2.0.21"
        ksp = "2.0.21-1.0.28"
        composeBom = "2024.10.01"
        firebaseBom = "33.5.1"
        activityCompose = "1.9.3"
        coreKtx = "1.15.0"
        lifecycle = "2.8.7"
        navigationCompose = "2.8.4"
        room = "2.6.1"
        coil = "2.7.0"
        retrofit = "2.11.0"
        moshi = "1.15.2"
        okhttp = "4.12.0"
        coroutines = "1.9.0"
        roborazzi = "1.29.0"
        secrets = "2.0.1"
        googleServices = "4.4.2"
        junit = "4.13.2"
        androidxJunit = "1.2.1"
        espresso = "3.6.1"
        robolectric = "4.13"

        [libraries]
        androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
        firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
        accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version = "0.36.0" }
        androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
        androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version = "1.4.0" }
        androidx-camera-core = { group = "androidx.camera", name = "camera-core", version = "1.4.0" }
        androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version = "1.4.0" }
        androidx-camera-view = { group = "androidx.camera", name = "camera-view", version = "1.4.0" }
        androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
        androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
        androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
        androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
        androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
        androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
        androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
        androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
        androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
        androidx-core = { group = "androidx.test", name = "core", version = "1.6.1" }
        androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
        androidx-credentials = { group = "androidx.credentials", name = "credentials", version = "1.3.0" }
        androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version = "1.3.0" }
        androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.1.1" }
        androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
        androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
        androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
        androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
        androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
        androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
        androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
        androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
        androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
        androidx-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
        coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
        converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
        firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }
        firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
        firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
        firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
        firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
        googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version = "1.1.1" }
        junit = { group = "junit", name = "junit", version.ref = "junit" }
        kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
        kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
        kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
        logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
        moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
        moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
        okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
        play-services-location = { group = "com.google.android.gms", name = "play-services-location", version = "21.3.0" }
        retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
        robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
        roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
        roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
        roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

        [plugins]
        android-application = { id = "com.android.application", version.ref = "agp" }
        kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
        kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
        google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
        roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
        secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
        google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
        EOF

        # 5. Create empty debug.keystore if not present to satisfy signingConfigs
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VidGrab-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
